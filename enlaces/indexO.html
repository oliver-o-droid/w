<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#115e59">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <title>11Enlaces - Dark Mode</title>

  <style>
    :root {
      /* Paleta de colores para el Modo Oscuro */
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --header-bg: #56425d;
      --header-bg-open: #2a2a2a;
      --header-text: #e0e0e0;
      --primary-accent: #0f766e;
      --primary-accent-dark: #115e59;
      --text-color: #e0e0e0;
      --border-color: #333;
      --btn-link-bg: #558374;
      --btn-link-hover: #059669;
      --btn-secondary-bg: #555;
      --btn-secondary-hover: #6b7280;
      --success-bg: #065f46;
      --success-border: #10b981;
      --success-text: #d1fae5;
      --error-bg: #7f1d1d;
      --error-border: #ef4444;
      --error-text: #fee2e2;
      --border-radius: 16px;
      --card-link-bg: #1e1e1e;
      --grid-gap: 15px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      min-height: 100vh;
      color: var(--text-color);
      padding: 20px;
    }

    .contenedor-principal {
      max-width: 800px;
      margin: 0 auto;
    }

    .encabezado-app {
      background: linear-gradient(135deg, var(--primary-accent-dark) 0%, var(--primary-accent) 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      border-radius: var(--border-radius);
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .theme-switcher {
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .encabezado-app h1 { font-size: 2em; font-weight: 700; }

    .contenedor-enlaces {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .seccion-enlaces {
      background: var(--header-bg);
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      transition: background-color 0.3s ease-in-out 0.2s;
    }

    .seccion-enlaces .enlace-encabezado {
      font-size: 1.3em;
      font-weight: 700;
      color: white;
      padding: 20px;
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: color 0.3s ease-in-out 0.2s, transform 0.2s ease;
    }

    .seccion-enlaces.abierto {
      background-color: var(--header-bg-open);
      transition-delay: 0s;
    }

    .seccion-enlaces.abierto .enlace-encabezado {
      color: var(--header-text);
      transition-delay: 0s;
    }

    .seccion-enlaces .enlace-encabezado::before,
    .seccion-enlaces .enlace-encabezado::after {
      content: '';
      position: absolute;
      right: 20px;
      top: 50%;
      width: 14px;
      height: 2px;
      background-color: currentColor;
      transition: transform 0.3s ease-out;
    }

    .seccion-enlaces .enlace-encabezado::before {
      transform: translateY(-50%) rotate(90deg);
    }

    .seccion-enlaces .enlace-encabezado.abierto::before {
      transform: translateY(-50%) rotate(360deg);
    }

    .grupo-tarjetas {
      display: flex;
      flex-direction: column;
      gap: var(--grid-gap);
      padding: 0 var(--grid-gap) var(--grid-gap);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease-in-out, padding 0.5s ease-in-out;
    }
    
    .grupo-tarjetas.abierto {
      max-height: 1000vh;
    }

    .enlace-card {
      background: var(--card-link-bg);
      padding: 15px;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateY(-30px);
      transition: opacity 0.3s ease-out, transform 0.3s ease-out;
    }

    .grupo-tarjetas.abierto .enlace-card {
      opacity: 1;
      transform: translateY(0);
    }

    .grupo-tarjetas.abierto .enlace-card:nth-child(1) { transition-delay: 0.05s; }
    .grupo-tarjetas.abierto .enlace-card:nth-child(2) { transition-delay: 0.1s; }
    .grupo-tarjetas.abierto .enlace-card:nth-child(3) { transition-delay: 0.15s; }
    .grupo-tarjetas.abierto .enlace-card:nth-child(4) { transition-delay: 0.2s; }
    .grupo-tarjetas.abierto .enlace-card:nth-child(5) { transition-delay: 0.25s; }

    .enlace-info {
      flex-grow: 1;
      margin-bottom: 15px;
    }
    .enlace-descripcion { font-weight: 600; color: var(--text-color); font-size: 1.1em; }

    button, .btn-enlace {
      padding: 11px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95em;
      transition: background-color 0.3s, transform 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      width: 100%;
    }

    .btn-enlace { background-color: var(--btn-link-bg); color: white; }
    .btn-primary { background-color: var(--primary-accent); color: white; }
    .btn-secondary { background-color: var(--btn-secondary-bg); color: white; }

    .btn-flotante {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      background-color: var(--primary-accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      z-index: 999;
      border: none;
      cursor: pointer;
    }

    .btn-flotante-edit {
      position: fixed;
      bottom: 105px;
      right: 30px;
      width: 60px;
      height: 60px;
      background-color: var(--primary-accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      z-index: 999;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .btn-flotante-edit.activo {
      background-color: #f59e0b;
    }

    .contenedor-botones-edicion {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn-edicion {
      flex: 1;
      padding: 11px 5px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1em;
      text-transform: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: background-color 0.3s, transform 0.2s;
    }

    .btn-subir { background-color: #5c727a; color: white; }
    .btn-subir:hover { background-color: #455a64; }
    .btn-bajar { background-color: #5c727a; color: white; }
    .btn-bajar:hover { background-color: #455a64; }
    .btn-borrar { background-color: #9e2a2b; color: white; }
    .btn-borrar:hover { background-color: #7f1d1d; }
    .btn-editar-link { background-color: #d97706; color: white; }
    .btn-editar-link:hover { background-color: #b45309; }

    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal.activo { display: flex; align-items: center; justify-content: center; }
    .modal-contenido { background-color: var(--card-bg); color: var(--text-color); padding: 30px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); max-width: 500px; width: 90%; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-encabezado { font-size: 1.5em; font-weight: 700; margin-bottom: 20px; color: var(--text-color); }
    .modal-formulario { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
    .grupo-campo { display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 6px; color: var(--text-color); font-size: 0.95em; }
    input[type="text"], input[type="url"], select { background-color: #333; color: var(--text-color); padding: 12px; border: 2px solid #444; border-radius: 8px; font-size: 1em; transition: border-color 0.3s, box-shadow 0.3s; font-family: inherit; }
    input[type="text"]:focus, input[type="url"]:focus, select:focus { outline: none; border-color: #0f766e; box-shadow: 0 0 8px rgba(15, 118, 110, 0.2); }
    .modal-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .mensaje-confirmacion { padding: 20px; border-radius: 8px; text-align: center; }
    .mensaje-exito { background-color: var(--success-bg); border: 2px solid var(--success-border); color: var(--success-text); }
    .mensaje-error { background-color: var(--error-bg); border: 2px solid var(--error-border); color: var(--error-text); }
    .mensaje-titulo { font-weight: 700; font-size: 1.1em; margin-bottom: 8px; }
    .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #0f766e; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .cargando-overlay { text-align: center; padding: 40px; }

    .overlay-procesando {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn 0.2s ease;
    }
    .overlay-procesando .overlay-contenido {
      background-color: var(--card-bg, #ffffff);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .overlay-procesando p {
      font-weight: 600;
      color: var(--text-color, #333);
      font-size: 1.1em;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .encabezado-app { padding: 30px 15px; margin-bottom: 20px; }
      .encabezado-app h1 { font-size: 1.5em; }
      .grupo-tarjetas { grid-template-columns: 1fr; }
      .btn-flotante { bottom: 20px; right: 20px; }
      .btn-flotante-edit { bottom: 95px; right: 20px; }
      .modal-botones { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="contenedor-principal">
    <!-- Encabezado -->
    <div class="encabezado-app">
      <a href="index.html" class="theme-switcher" title="Cambiar a modo claro">
        <h1>11Enlaces</h1>
      </a>
    </div>

    <!-- Contenido principal -->
    <div class="contenido">
      <div class="contenedor-enlaces" id="contenedorEnlaces">
        <!-- Overlay de carga inicial -->
        <div class="cargando-overlay" id="cargando">
          <div class="spinner"></div>
          <p style="margin-top: 15px; color: #aaa;">Cargando enlaces...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Botón flotante para añadir URL -->
  <button class="btn-flotante" id="btnAbrirModalAñadir" title="Añadir nuevo enlace">+</button>

  <!-- Botón flotante para editar enlaces -->
  <button class="btn-flotante-edit" id="btnModoEdicion" title="Modo edición">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
  </button>

  <!-- Modal para Añadir URL -->
  <div id="modalAñadir" class="modal">
    <div class="modal-contenido">
      <div class="modal-encabezado">Añadir Nuevo Enlace</div>
      <div class="modal-formulario">
        <div class="grupo-campo">
          <label for="modalBoton">Texto del botón</label>
          <input type="text" id="modalBoton" placeholder="Ej: Google, Mi Portfolio...">
        </div>
        <div class="grupo-campo">
          <label for="modalDescripcion">Descripción</label>
          <input type="text" id="modalDescripcion" placeholder="Una breve descripción del enlace">
        </div>
        <div class="grupo-campo">
          <label for="modalUrl">URL</label>
          <input type="url" id="modalUrl" placeholder="https://www.ejemplo.com">
        </div>
        <div class="grupo-campo">
          <label for="modalEncabezado">Categoría (Encabezado)</label>
          <select id="modalEncabezado"></select>
        </div>
        <div class="grupo-campo" id="grupoNuevoEncabezado" style="display: none;">
          <label for="modalNuevoEncabezado">Texto del nuevo encabezado</label>
          <input type="text" id="modalNuevoEncabezado" placeholder="Ej: Redes Sociales">
        </div>
      </div>
      <div class="modal-botones">
        <button class="btn-secondary" id="btnCancelarAñadir">Cancelar</button>
        <button class="btn-primary" id="btnConfirmarAñadir">Guardar Enlace</button>
      </div>
    </div>
  </div>

  <!-- Modal de Confirmación/Error -->
  <div id="modalConfirmacion" class="modal">
    <div class="modal-contenido" id="contenidoConfirmacion">
      <!-- Contenido dinámico -->
    </div>
  </div>

  <!-- Overlay de Procesamiento -->
  <div id="overlayProcesando" class="overlay-procesando" style="display: none;">
    <div class="overlay-contenido">
      <div class="spinner"></div>
      <p>Procesando...</p>
    </div>
  </div>

  <script>
    // URL de la API de Google Apps Script
    const API_URL = 'https://script.google.com/macros/s/AKfycbxl5Uz3eM0E6mRBok5Qh5G5T9KHoy6y_avntD1jRIqSGxBYlYU9KT8rLnw8yDyyx9LjUw/exec';

    const contenedorEnlaces = document.getElementById('contenedorEnlaces');
    const cargandoDiv = document.getElementById('cargando');
    const overlayProcesando = document.getElementById('overlayProcesando');
    let modoEdicion = false;
    let editandoFila = null;

    function mostrarProcesando(mostrar) {
      overlayProcesando.style.display = mostrar ? 'flex' : 'none';
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Listeners de los botones y modales
      document.getElementById('btnAbrirModalAñadir').addEventListener('click', abrirModalAñadir);
      document.getElementById('btnCancelarAñadir').addEventListener('click', cerrarModalAñadir);
      document.getElementById('btnConfirmarAñadir').addEventListener('click', confirmarAñadir);
      document.getElementById('btnModoEdicion').addEventListener('click', toggleModoEdicion);
      window.addEventListener('click', function(event) {
        if (event.target.classList.contains('modal')) {
          event.target.classList.remove('activo');
        }
      });
      document.getElementById('modalEncabezado').addEventListener('change', function() {
        const esNuevo = this.value === 'nuevo';
        document.getElementById('grupoNuevoEncabezado').style.display = esNuevo ? 'flex' : 'none';
      });

      // --- Lógica de carga principal ---
      const params = new URLSearchParams(window.location.search);
      if (params.has('url')) {
        // Si se comparte un enlace, se abre directamente el modal y se rellenan los campos.
        const sharedUrl = params.get('url');
        const sharedTitle = params.get('title');
        const sharedText = params.get('text');

        abrirModalAñadir().then(() => {
          document.getElementById('modalUrl').value = sharedUrl;
          if (sharedTitle) {
            document.getElementById('modalDescripcion').value = sharedTitle;
          } else if (sharedText && sharedText !== sharedUrl) {
            document.getElementById('modalDescripcion').value = sharedText;
          }
        });
      } else {
        // Si no, se carga la lista de enlaces normal.
        cargarEnlaces();
      }

      // Registrar el Service Worker para la PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .then(registration => {
            console.log('Service Worker registrado con éxito:', registration);
          })
          .catch(error => {
            console.log('Error al registrar el Service Worker:', error);
          });
      }
    });

    /**
     * Carga los enlaces usando la estrategia "Stale-While-Revalidate".
     */
    async function cargarEnlaces() { 
      const cachedData = localStorage.getItem('cachedEnlaces');
      let seMostroCache = false;

      if (cachedData) {
        console.log("Mostrando datos desde caché local...");
        const enlaces = JSON.parse(cachedData);
        renderizarEnlaces(enlaces);
        seMostroCache = true;
      } else {
        cargandoDiv.style.display = 'block';
      }

      try {
        console.log("Pidiendo datos frescos a la red...");
        const response = await fetch(`${API_URL}?accion=getUrls`);
        if (!response.ok) {
          throw new Error(`Error de red: ${response.statusText}`);
        }
        const result = await response.json();

        if (result.status === 'ok') {
          console.log("Datos frescos recibidos. Actualizando UI y caché.");
          const freshDataStr = JSON.stringify(result.data);
          if (freshDataStr !== cachedData) {
            renderizarEnlaces(result.data);
            localStorage.setItem('cachedEnlaces', freshDataStr);
          } else {
            console.log("Los datos frescos son idénticos a los de la caché. No se requiere re-renderizado.");
          }
        } else {
          throw new Error(`Error en la API: ${result.message}`);
        }
      } catch (error) {
        console.error('No se pudieron obtener los datos frescos:', error);
        if (!seMostroCache) {
          mostrarError(error);
        }
      } finally {
        cargandoDiv.style.display = 'none';
      }
    }

    /**
     * Renderiza los enlaces y encabezados en el contenedor principal.
     * @param {Array<Object>} datos - El array de enlaces y encabezados del backend.
     */
    function renderizarEnlaces(datos) {
      // Guardar el estado de qué secciones estaban abiertas
      const seccionesAbiertas = new Set();
      document.querySelectorAll('.seccion-enlaces.abierto > .enlace-encabezado').forEach(el => {
        seccionesAbiertas.add(el.textContent.trim());
      });

      contenedorEnlaces.innerHTML = '';

      if (!datos || datos.length === 0) {
        contenedorEnlaces.innerHTML = '<p style="text-align:center; color:#aaa;">No hay enlaces para mostrar. ¡Añade el primero!</p>';
        return;
      }

      let ultimoEncabezado = '';
      datos.forEach(item => {
        if (item.tipo === 'encabezado') {
          ultimoEncabezado = item.titulo;
          const seccionActual = document.createElement('div');
          seccionActual.className = 'seccion-enlaces';

          const encabezadoDiv = document.createElement('div');
          encabezadoDiv.className = 'enlace-encabezado';
          encabezadoDiv.textContent = item.titulo;

          const grupoTarjetasActual = document.createElement('div');
          grupoTarjetasActual.className = 'grupo-tarjetas';

          // Si la sección estaba abierta antes de re-renderizar, restauramos su estado
          if (seccionesAbiertas.has(item.titulo.trim())) {
            seccionActual.classList.add('abierto');
            encabezadoDiv.classList.add('abierto');
            grupoTarjetasActual.classList.add('abierto');
          }

          encabezadoDiv.onclick = () => {
            encabezadoDiv.classList.toggle('abierto');
            seccionActual.classList.toggle('abierto');
            grupoTarjetasActual.classList.toggle('abierto');
          };
          
          seccionActual.appendChild(encabezadoDiv);
          seccionActual.appendChild(grupoTarjetasActual);
          contenedorEnlaces.appendChild(seccionActual);

        } else if (item.tipo === 'enlace') {
          item.categoria = ultimoEncabezado;
          const grupoTarjetasActual = contenedorEnlaces.lastChild.querySelector('.grupo-tarjetas');
          const card = crearCardEnlace(item); 
          if (grupoTarjetasActual) {
            grupoTarjetasActual.appendChild(card);
          }
        }
      });
    }

    /**
     * Crea el elemento HTML para una tarjeta de enlace.
     * @param {Object} enlace - El objeto de enlace.
     * @returns {HTMLElement} El elemento div de la tarjeta.
     */
    function crearCardEnlace(enlace) {
      const card = document.createElement('div');
      card.className = 'enlace-card';

      const info = document.createElement('div');
      info.className = 'enlace-info';
      info.innerHTML = `<div class="enlace-descripcion">${enlace.descripcion || 'Sin descripción'}</div>`;
      card.appendChild(info);

      if (modoEdicion) {
        const editContainer = document.createElement('div');
        editContainer.className = 'contenedor-botones-edicion';

        const btnUp = document.createElement('button');
        btnUp.className = 'btn-edicion btn-subir';
        btnUp.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';
        btnUp.title = 'Subir';
        btnUp.onclick = () => subirFila(enlace.fila);

        const btnDown = document.createElement('button');
        btnDown.className = 'btn-edicion btn-bajar';
        btnDown.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>';
        btnDown.title = 'Bajar';
        btnDown.onclick = () => bajarFila(enlace.fila);

        const btnEdit = document.createElement('button');
        btnEdit.className = 'btn-edicion btn-editar-link';
        btnEdit.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
        btnEdit.title = 'Editar';
        btnEdit.onclick = () => abrirModalEditar(enlace);

        const btnDel = document.createElement('button');
        btnDel.className = 'btn-edicion btn-borrar';
        btnDel.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';
        btnDel.title = 'Borrar';
        btnDel.onclick = () => borrarFila(enlace.fila);

        editContainer.appendChild(btnUp);
        editContainer.appendChild(btnDown);
        editContainer.appendChild(btnEdit);
        editContainer.appendChild(btnDel);
        card.appendChild(editContainer);
      } else {
        const linkButton = document.createElement('a');
        linkButton.className = 'btn-enlace';
        linkButton.textContent = enlace.boton || 'Ir';
        linkButton.href = enlace.url;
        linkButton.target = '_blank';
        linkButton.rel = 'noopener noreferrer';
        card.appendChild(linkButton);
      }

      return card;
    }

    function toggleModoEdicion() {
      modoEdicion = !modoEdicion;
      const btn = document.getElementById('btnModoEdicion');
      btn.classList.toggle('activo', modoEdicion);
      
      if (modoEdicion) {
        btn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        btn.title = 'Guardar cambios';
      } else {
        btn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>';
        btn.title = 'Modo edición';
      }

      const cachedData = localStorage.getItem('cachedEnlaces');
      if (cachedData) {
        renderizarEnlaces(JSON.parse(cachedData));
      }
    }

    async function subirFila(fila) {
      if (fila <= 2) return;
      mostrarProcesando(true);
      try {
        const response = await fetch(`${API_URL}?accion=moveUpRow&fila=${fila}`);
        const result = await response.json();
        if (result.exito) {
          await forzarRecarga();
        } else {
          alert("Error: " + result.mensaje);
        }
      } catch (error) {
        console.error(error);
        alert("Error de red");
      } finally {
        mostrarProcesando(false);
      }
    }

    async function bajarFila(fila) {
      mostrarProcesando(true);
      try {
        const response = await fetch(`${API_URL}?accion=moveDownRow&fila=${fila}`);
        const result = await response.json();
        if (result.exito) {
          await forzarRecarga();
        } else {
          alert("Error: " + result.mensaje);
        }
      } catch (error) {
        console.error(error);
        alert("Error de red");
      } finally {
        mostrarProcesando(false);
      }
    }

    async function borrarFila(fila) {
      if (!confirm("¿Seguro que quieres borrar este enlace?")) return;
      mostrarProcesando(true);
      try {
        const response = await fetch(`${API_URL}?accion=deleteRow&fila=${fila}`);
        const result = await response.json();
        if (result.exito) {
          await forzarRecarga();
        } else {
          alert("Error: " + result.mensaje);
        }
      } catch (error) {
        console.error(error);
        alert("Error de red");
      } finally {
        mostrarProcesando(false);
      }
    }

    async function forzarRecarga() {
      try {
        const response = await fetch(`${API_URL}?accion=getUrls`);
        if (!response.ok) throw new Error(`Error: ${response.statusText}`);
        const result = await response.json();
        if (result.status === 'ok') {
          localStorage.setItem('cachedEnlaces', JSON.stringify(result.data));
          renderizarEnlaces(result.data);
        }
      } catch (error) {
        console.error(error);
      }
    }

    /**
     * Muestra un mensaje de error en el contenedor principal.
     * @param {Error} error - El objeto de error del backend.
     */
    function mostrarError(error) {
      cargandoDiv.style.display = 'none';
      contenedorEnlaces.innerHTML = `
        <div class="mensaje-confirmacion mensaje-error">
          <div class="mensaje-titulo">Error</div>
          <div class="mensaje-texto">${error.message}</div>
        </div>
      `;
    }

    // --- Lógica para el Modal de Añadir (sin cambios) ---

    async function abrirModalAñadir() {
      editandoFila = null;
      document.querySelector('#modalAñadir .modal-encabezado').textContent = 'Añadir Nuevo Enlace';
      document.getElementById('btnConfirmarAñadir').textContent = 'Guardar Enlace';

      document.getElementById('modalBoton').value = '';
      document.getElementById('modalDescripcion').value = '';
      document.getElementById('modalUrl').value = '';
      document.getElementById('modalNuevoEncabezado').value = '';
      document.getElementById('grupoNuevoEncabezado').style.display = 'none';

      const select = document.getElementById('modalEncabezado');
      select.innerHTML = '';
      select.disabled = true;

      try {
        const response = await fetch(`${API_URL}?accion=getHeaders`);
        const result = await response.json();
        if (result.status === 'ok') {
          result.data.forEach(header => {
            const option = new Option(header, header);
            select.add(option);
          });
          select.add(new Option('--- Añadir nuevo encabezado ---', 'nuevo'));
          select.disabled = false;
          
          const existeOtros = Array.from(select.options).some(opt => opt.value === 'Otros');
          if (existeOtros) {
            select.value = 'Otros';
          }
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        console.error("Error al cargar encabezados:", err);
        select.disabled = false;
      }

      document.getElementById('modalAñadir').classList.add('activo');
    }

    async function abrirModalEditar(enlace) {
      editandoFila = enlace.fila;
      
      document.querySelector('#modalAñadir .modal-encabezado').textContent = 'Editar Enlace';
      document.getElementById('btnConfirmarAñadir').textContent = 'Guardar Cambios';

      document.getElementById('modalBoton').value = enlace.boton || '';
      document.getElementById('modalDescripcion').value = enlace.descripcion || '';
      document.getElementById('modalUrl').value = enlace.url || '';
      document.getElementById('modalNuevoEncabezado').value = '';
      document.getElementById('grupoNuevoEncabezado').style.display = 'none';

      const select = document.getElementById('modalEncabezado');
      select.innerHTML = '';
      select.disabled = true;

      try {
        const response = await fetch(`${API_URL}?accion=getHeaders`);
        const result = await response.json();
        if (result.status === 'ok') {
          result.data.forEach(header => {
            const option = new Option(header, header);
            select.add(option);
          });
          select.add(new Option('--- Añadir nuevo encabezado ---', 'nuevo'));
          select.disabled = false;
          
          if (enlace.categoria) {
            select.value = enlace.categoria;
          } else {
            const existeOtros = Array.from(select.options).some(opt => opt.value === 'Otros');
            if (existeOtros) {
              select.value = 'Otros';
            }
          }
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        console.error("Error al cargar encabezados:", err);
        select.disabled = false;
      }

      document.getElementById('modalAñadir').classList.add('activo');
    }

    function cerrarModalAñadir() {
      document.getElementById('modalAñadir').classList.remove('activo');
      editandoFila = null;
    }

    async function confirmarAñadir() {
      const boton = document.getElementById('modalBoton').value.trim();
      const descripcion = document.getElementById('modalDescripcion').value.trim();
      const url = document.getElementById('modalUrl').value.trim();
      const selectedHeader = document.getElementById('modalEncabezado').value;
      const newHeader = document.getElementById('modalNuevoEncabezado').value.trim();

      if (!boton || !url) {
        alert('El texto del botón y la URL son obligatorios.');
        return;
      }

      if (selectedHeader === 'nuevo' && !newHeader) {
        alert('Por favor, introduce el texto para el nuevo encabezado.');
        return;
      }

      const btnConfirmar = document.getElementById('btnConfirmarAñadir');
      btnConfirmar.disabled = true;
      btnConfirmar.textContent = 'Guardando...';

      const params = new URLSearchParams();
      if (editandoFila !== null) {
        params.append('accion', 'updateUrl');
        params.append('fila', editandoFila);
      } else {
        params.append('accion', 'addUrl');
      }
      params.append('boton', boton);
      params.append('descripcion', descripcion);
      params.append('url', url);
      params.append('selectedHeader', selectedHeader);
      params.append('newHeader', newHeader);

      try {
        const response = await fetch(`${API_URL}?${params.toString()}`);
        const respuesta = await response.json();
        
        btnConfirmar.disabled = false;
        btnConfirmar.textContent = editandoFila !== null ? 'Guardar Cambios' : 'Guardar Enlace';
        cerrarModalAñadir();
        mostrarConfirmacion(respuesta);
        if (respuesta.exito) {
          cargarEnlaces();
        }
      } catch (error) {
        btnConfirmar.disabled = false;
        btnConfirmar.textContent = editandoFila !== null ? 'Guardar Cambios' : 'Guardar Enlace';
        mostrarConfirmacion({ exito: false, mensaje: error.message });
      }
    }

    function mostrarConfirmacion(respuesta) {
      const contenido = document.getElementById('contenidoConfirmacion');
      const modal = document.getElementById('modalConfirmacion');

      let html = '';
      if (respuesta.exito) {
        html = `
          <div class="mensaje-confirmacion mensaje-exito">
            <div class="mensaje-titulo">¡Éxito!</div>
            <div class="mensaje-texto">${respuesta.mensaje}</div>
          </div>
        `;
      } else {
        html = `
          <div class="mensaje-confirmacion mensaje-error">
            <div class="mensaje-titulo">Error</div>
            <div class="mensaje-texto">${respuesta.mensaje || respuesta.message || JSON.stringify(respuesta) || 'Ocurrió un error desconocido.'}</div>
          </div>
        `;
      }

      html += '<button class="btn-secondary" style="width:100%; margin-top:20px;" onclick="cerrarConfirmacion()">Cerrar</button>';

      contenido.innerHTML = html;
      modal.classList.add('activo');
    }

    function cerrarConfirmacion() {
      location.reload();
    }

  </script>
</body>
</html>
